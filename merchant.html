<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6f4e37">
  <title>前往店家營收中心</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f2ea;color:#2e2925;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}.card{width:min(420px,100%);padding:38px;text-align:center;background:#fffdf9;border:1px solid #e8ddd1;border-radius:26px;box-shadow:0 14px 40px rgba(67,47,33,.09)}.mark{width:54px;height:54px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#74513a;color:white;font:700 22px Georgia,serif}h1{font:700 28px Georgia,"Noto Serif TC",serif;margin:20px 0 10px}p{color:#766d65;line-height:1.7;margin:0}.loader{width:28px;height:28px;margin:24px auto 0;border:3px solid #dfd0c2;border-top-color:#74513a;border-radius:50%;animation:spin .8s linear infinite}button{display:none;width:100%;margin-top:24px;padding:13px;border:0;border-radius:12px;background:#74513a;color:#fff;font:700 15px inherit;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Z</div>
    <h1>店家營收中心</h1>
    <p id="message">正在連接目前的營收伺服器…</p>
    <div id="loader" class="loader"></div>
    <button id="retry" type="button">重新連線</button>
  </main>
  <script>
    async function connect(){
      const message=document.getElementById('message');
      const retry=document.getElementById('retry');
      const loader=document.getElementById('loader');
      retry.style.display='none';loader.style.display='block';message.textContent='正在連接目前的營收伺服器…';
      try{
        const response=await fetch(`./config.json?t=${Date.now()}`,{cache:'no-store'});
        if(!response.ok)throw new Error();
        const config=await response.json();
        const target=new URL('/merchant',config.api);
        if(target.protocol!=='https:'&&target.hostname!=='localhost')throw new Error();
        location.replace(target.toString());
      }catch{
        loader.style.display='none';retry.style.display='block';message.textContent='目前無法取得伺服器網址，請確認店內主機已開機後再試。';
      }
    }
    document.getElementById('retry').addEventListener('click',connect);
    connect();
  </script>
</body>
</html>
