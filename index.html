<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>客人點餐</title>
<style>
  :root{
    --bg:#f4f0e8; --card:#fffdf8; --text:#3f372f; --muted:#85796d; --line:#ded5c8;
    --accent:#715640; --accent-d:#574130; --sage:#7b846c;
    --c0:#715640; --c1:#7b846c; --c2:#9a795e; --c3:#687563; --c4:#896e5a; --c5:#7f735f; --c6:#5f6b5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    background-image:radial-gradient(circle at 12% 4%,#fffdf8 0,transparent 32%),linear-gradient(180deg,#f7f3ec 0,#f0ebe2 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;padding-bottom:96px;letter-spacing:.02em}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 18px}
  /* header */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .store{font-family:"Noto Serif TC","Songti TC",serif;font-size:30px;font-weight:700;line-height:1.25;letter-spacing:.08em}
  .sub{color:var(--muted);font-size:14px;margin-top:7px;letter-spacing:.12em}
  /* section title */
  h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;font-weight:700;margin:26px 0 13px;letter-spacing:.08em}
  .count{color:var(--muted);font-size:15px;font-weight:600}
  /* categories */
  .cats{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;min-width:96px;height:52px;padding:0 19px;border-radius:4px 16px 4px 16px;border:1px solid #ffffff45;cursor:pointer;color:#fffdf8;
    display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:16px;line-height:1.2;letter-spacing:.08em;box-shadow:0 5px 14px #594b3b18;transition:transform .18s ease,box-shadow .18s ease}
  .cat.on{outline:2px solid var(--text);outline-offset:3px;transform:translateY(-2px);box-shadow:0 8px 20px #594b3b2b}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .item{background:var(--card);border-radius:5px 22px 5px 22px;box-shadow:0 8px 24px #5d4a3512;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;text-align:left;border:1px solid #e7ded1;padding:0;transition:transform .18s ease,box-shadow .18s ease}
  .item:active{transform:scale(.985)}
  .item .imgbox{position:relative;height:150px;background:#eee5d9;display:flex;align-items:center;justify-content:center;font-size:52px}
  .item .imgbox img{width:100%;height:100%;object-fit:cover;display:block}
  .qty-badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;
    padding:5px 11px;border-radius:999px}
  .item .body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px}
  .item .name{font-family:"Noto Serif TC","Songti TC",serif;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.05em}
  .item .desc{color:var(--muted);font-size:13px;line-height:1.35;min-height:34px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .price{color:var(--accent);font-weight:800;font-size:18px}
  .plus{width:34px;height:34px;border-radius:4px 12px 4px 12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  /* bottom cart bar */
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(250,247,240,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .cartbar .inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .cartbtn{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:#fff;
    border:1px solid #ffffff33;border-radius:4px 16px 4px 16px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.08em;box-shadow:0 6px 18px #59402b33}
  .cartbtn:disabled{opacity:.45}
  .cartbtn .n{background:#fff;color:var(--accent);border-radius:999px;min-width:24px;height:24px;display:inline-flex;
    align-items:center;justify-content:center;font-size:14px;padding:0 7px}
  /* sheet */
  .mask{position:fixed;inset:0;background:#0006;z-index:40;display:none}
  .mask.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:28px 28px 0 0;
    max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .28s ease;
    padding:0 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet.show{transform:translateY(0)}
  .sheet{max-width:600px;margin:0 auto}
  .sheet .grab{width:40px;height:5px;background:#d1d1d6;border-radius:3px;margin:10px auto 4px}
  .sheet h3{font-family:"Noto Serif TC","Songti TC",serif;font-size:22px;font-weight:700;margin:10px 2px 14px;letter-spacing:.07em}
  .block{background:var(--card);border:1px solid #e7ded1;border-radius:6px 18px 6px 18px;padding:6px 14px;margin-bottom:16px;box-shadow:0 5px 18px #5d4a350a}
  .block.pad{padding:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  /* 購物車品項 */
  .citem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .citem:last-child{border-bottom:0}
  .ci-img{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#fff2df;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
  .ci-img img{width:100%;height:100%;object-fit:cover}
  .ci-info{flex:1;min-width:0}.ci-edit{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;color:inherit;cursor:pointer}.ci-edit .ci-name:after{content:"  編輯";color:var(--accent);font-size:12px;font-weight:800}.ci-note{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-opt{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci-price{color:var(--accent);font-weight:800;margin-top:3px;font-size:15px}
  .stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .stepper span{min-width:18px;text-align:center;font-weight:700}
  .stepper button{width:30px;height:30px;border-radius:50%;border:0;background:#e9e9ef;font-size:18px;font-weight:700;cursor:pointer;color:var(--text)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:1px solid var(--line);border-radius:4px 12px 4px 12px;background:#eee8df;padding:12px;font-size:15px;font-weight:700;cursor:pointer;color:var(--text)}
  .seg button.on{background:var(--accent);color:#fff}
  .field{width:100%;border:1px solid var(--line);border-radius:4px 12px 4px 12px;padding:12px 14px;font-size:16px;outline:0;background:#fffdf8;color:var(--text)}
  .field:focus{border-color:var(--sage);box-shadow:0 0 0 3px #7b846c20}
  .label{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
  .tables button{border:1px solid var(--line);border-radius:4px 10px 4px 10px;background:#eee8df;min-height:44px;font-weight:700;font-size:16px;cursor:pointer;color:var(--text)}
  .tables button.on{background:var(--accent);color:#fff}
  .totalrow{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:800;margin:4px 2px 12px}
  .submit{width:100%;border:1px solid #ffffff33;border-radius:4px 16px 4px 16px;background:var(--accent);color:#fff;padding:16px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:.1em;box-shadow:0 6px 18px #59402b2b}
  .submit:disabled{opacity:.5}
  .opt{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:3px 12px 3px 12px;margin-bottom:8px;cursor:pointer;font-weight:600;background:#fffdf8}
  .opt:has(input:checked){border-color:var(--accent);background:#ebe2d6;color:#4b382a;box-shadow:inset 3px 0 var(--accent)}
  .opt input{width:20px;height:20px;accent-color:var(--accent)}
  .success{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .success.show{display:flex}
  .check{width:88px;height:88px;border-radius:50%;background:var(--c2);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .err{color:#ff3b30;text-align:center;padding:40px 20px}
  .bot-check{background:var(--card);border-radius:16px;padding:14px;margin:0 0 16px}.bot-check-status{color:var(--muted);font-size:13px;margin-top:8px}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="store" id="store-name">載入中…</div>
        <div class="sub">今天想吃點什麼？</div>
      </div>
    </div>

    <h2 style="margin-top:20px">餐點分類</h2>
    <div class="cats" id="cats"></div>

    <h2 style="display:flex;align-items:center;justify-content:space-between">
      <span id="section-title">推薦餐點</span><span class="count" id="section-count"></span>
    </h2>
    <div class="grid" id="grid"></div>
  </div>

  <div class="cartbar">
    <div class="inner">
      <button class="cartbtn" id="cartbtn" disabled onclick="openCart()">
        <span><span class="n" id="cart-count">0</span> 查看購物車</span>
        <span id="cart-total">$0</span>
      </button>
    </div>
  </div>

  <div class="mask" id="mask" onclick="closeAll()"></div>

  <!-- 餐點選項 -->
  <div class="sheet" id="opt-sheet">
    <div class="grab"></div>
    <h3 id="opt-title"></h3>
    <div class="block" id="opt-groups"></div>
    <div class="label" style="margin-left:2px">單品備註</div>
    <div class="block pad"><input class="field" id="opt-note" maxlength="200" placeholder="例如：醬料另外放（可留空）"></div>
    <div class="totalrow"><span class="stepper"><button onclick="optQty(-1)">−</button><span id="opt-qty">1</span><button onclick="optQty(1)">＋</button></span><span id="opt-price">$0</span></div>
    <button class="submit" id="opt-submit" onclick="saveOptToCart()">加入購物車</button>
  </div>

  <!-- 購物車 / 結帳 -->
  <div class="sheet" id="cart-sheet">
    <div class="grab"></div>
    <h3 id="cart-title">購物車</h3>
    <div class="block" id="cart-items"></div>

    <div class="label" style="margin-left:2px">用餐方式</div>
    <div class="block pad">
      <div class="seg" id="dine-seg" style="margin-bottom:12px"></div>
      <div id="table-wrap" style="display:none">
        <div class="label">桌號</div>
        <div id="table-area"></div>
      </div>
    </div>

    <div class="label" style="margin-left:2px">付款方式</div>
    <div class="block pad">
      <div class="seg" id="pay-seg"></div>
    </div>

    <div class="label" style="margin-left:2px">訂購人名稱（必填）</div>
    <div class="block pad"><input class="field" id="note" name="customerName" maxlength="50" autocomplete="name" required aria-required="true" placeholder="請輸入訂購人名稱"></div>

    <div class="label" id="bot-check-label" style="margin-left:2px;display:none">機器人驗證</div>
    <div class="bot-check" id="bot-check" style="display:none"><div id="turnstile-widget"></div><div class="bot-check-status" id="bot-check-status">請完成驗證後再送出訂單</div></div>

    <div class="totalrow"><span>總計</span><span id="checkout-total" style="color:var(--accent)">$0</span></div>
    <button class="submit" id="submit-btn" onclick="checkout()">送出訂單</button>
  </div>

  <div class="success" id="success">
    <div class="check">✓</div>
    <div style="font-size:24px;font-weight:800">訂單已送出！</div>
    <div class="sub" id="order-id" style="margin-top:8px"></div>
    <div class="totalrow" style="width:100%;max-width:360px;margin-top:20px"><span>金額</span><span id="success-total">$0</span></div>
    <button class="submit" style="max-width:360px" onclick="resetOrder()">再點一單</button>
  </div>

<script>
  const routeParts=location.pathname.split('/').filter(Boolean);
  const params=new URLSearchParams(location.search);
  // 後端網址優先序：?api= 參數 > 同目錄 config.json 的 api > 同源（後端自己提供時）
  let API_BASE=(params.get('api')||'').replace(/\/+$/,'');
  let TURNSTILE_SITE_KEY='';
  const storeId=params.get('store')||(routeParts[0]==='order'?routeParts[1]:null);
  async function resolveApiBase(){
    try{const c=await(await fetch('config.json',{cache:'no-store'})).json();if(!API_BASE&&c&&c.api)API_BASE=String(c.api).replace(/\/+$/,'');if(c&&c.turnstileSiteKey)TURNSTILE_SITE_KEY=String(c.turnstileSiteKey);}catch(e){}
  }
  const CAT_COLORS=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
  const CAT_EMOJI=['🍴','☕️','🥡','🥗','🔥','🎂'];
  const FOOD_EMOJI=['🍔','🍕','🍜','🍱','🥤','🍰'];

  const PAY_LABELS={cash:'現金',creditCard:'信用卡',mobilePayment:'行動支付',transfer:'匯款'};
  const DINING_LABELS={dineIn:'🍽 內用',takeout:'🥡 外帶'};
  let store=null, categories=[], products=[], selectedCat='all', tableCount=1, signature='';
  let payMethods=['cash','creditCard','mobilePayment','transfer'], diningOptions=['dineIn','takeout'];
  let cart=[], currentItem=null, editingCartIndex=null, optQtyN=1, dining=null, tableNo='', pay='', showTables=true;
  let turnstileToken='',turnstileWidgetId=null,turnstileRetries=0;

  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api=async(url,opt={})=>{const r=await fetch(API_BASE+url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'操作失敗');return r.json()};
  const foodEmoji=n=>FOOD_EMOJI[Math.abs([...String(n)].reduce((s,c)=>s+c.charCodeAt(0),0))%FOOD_EMOJI.length];
  const qtyOf=id=>cart.filter(c=>c.id===id).reduce((s,c)=>s+c.qty,0);

  function visual(item){
    return item.imagePath
      ? `<img src="${esc(API_BASE+item.imagePath)}" alt="${esc(item.name)}">`
      : foodEmoji(item.name);
  }

  function renderCats(){
    const el=document.getElementById('cats');
    el.innerHTML=categories.map((c,i)=>`<button class="cat ${selectedCat===c.id?'on':''}" style="background:${CAT_COLORS[i%CAT_COLORS.length]}" onclick="pickCat('${c.id}')">${esc(c.name)}</button>`).join('');
  }
  function pickCat(id){selectedCat=id;renderCats();renderGrid();}

  function visibleItems(){
    if(selectedCat==='all') return products;
    return products.filter(p=>p.category===selectedCat);
  }
  function renderGrid(){
    const items=visibleItems();
    const cat=categories.find(c=>c.id===selectedCat);
    document.getElementById('section-title').textContent=cat?cat.name:'推薦餐點';
    document.getElementById('section-count').textContent=items.length+' 項';
    const grid=document.getElementById('grid');
    if(!items.length){grid.innerHTML='<div class="empty">找不到符合的餐點</div>';return;}
    grid.innerHTML=items.map(item=>{const q=qtyOf(item.id);return `<button class="item" onclick="tapItem('${item.id}')">
      <div class="imgbox">${visual(item)}${q>0?`<span class="qty-badge">×${q}</span>`:''}</div>
      <div class="body">
        <div class="name">${esc(item.name)}</div>
        ${item.desc?`<div class="desc">${esc(item.desc)}</div>`:'<div class="desc"></div>'}
        <div class="foot"><span class="price">$${item.price}</span><span class="plus">＋</span></div>
      </div></button>`;}).join('');
  }

  // 點餐點：有選項開選項表，沒選項直接加
  function tapItem(id){
    const item=products.find(p=>p.id===id);
    if(!(item.optionGroups||[]).length){ addToCart(item,1,[],""); return; }
    openItemOptions(item,null);
  }
  function openItemOptions(item,cartIndex){
    currentItem=item;editingCartIndex=cartIndex;
    const existing=cartIndex===null?null:cart[cartIndex];
    optQtyN=existing?.qty||1;
    document.getElementById('opt-title').textContent=currentItem.name;
    document.getElementById('opt-groups').innerHTML=currentItem.optionGroups.map((g,gi)=>`
      <div class="label" style="margin:2px 0 8px">${esc(g.name)}${g.required?'（必選）':''}</div>
      ${g.choices.map((ch,ci)=>`<label class="opt"><span>${esc(ch.name)}</span>
        <span style="display:flex;align-items:center;gap:10px"><span style="color:var(--accent);font-size:13px;font-weight:800">${ch.priceDelta?'+$'+ch.priceDelta:'免費'}</span>
        <input type="${g.allowsMultiple?'checkbox':'radio'}" name="g${gi}" value="${ch.priceDelta||0}" data-g="${esc(g.name)}" data-n="${esc(ch.name)}" ${(existing?existing.addons.some(a=>a.groupName===g.name&&a.name===ch.name):g.required&&ci===0)?'checked':''} onchange="optPrice()"></span></label>`).join('')}`).join('');
    document.getElementById('opt-note').value=existing?.notes||'';
    document.getElementById('opt-qty').textContent=optQtyN;
    document.getElementById('opt-submit').textContent=existing?'更新品項':'加入購物車';
    optPrice();closeAll();openSheet('opt-sheet');
  }
  function optSelected(){const a=[];document.querySelectorAll('#opt-groups input:checked').forEach(i=>a.push({groupName:i.dataset.g,name:i.dataset.n,price:Number(i.value)}));return a;}
  function optPrice(){const add=optSelected().reduce((s,o)=>s+o.price,0);document.getElementById('opt-price').textContent='$'+(currentItem.price+add)*optQtyN;}
  function optQty(d){optQtyN=Math.max(1,optQtyN+d);document.getElementById('opt-qty').textContent=optQtyN;optPrice();}
  function saveOptToCart(){const wasEditing=editingCartIndex!==null;addToCart(currentItem,optQtyN,optSelected(),document.getElementById('opt-note').value.trim(),editingCartIndex);editingCartIndex=null;closeAll();if(wasEditing){renderCartItems();renderDining();renderTables();renderPay();openSheet('cart-sheet');}}

  function addToCart(item,qty,addons,notes='',replaceIndex=null){
    if(replaceIndex!==null)cart.splice(replaceIndex,1);
    const unit=item.price+addons.reduce((s,o)=>s+o.price,0);
    const key=item.id+'|'+addons.map(a=>a.groupName+a.name).sort().join('_')+'|'+notes;
    const ex=cart.find(c=>c.key===key);
    if(ex)ex.qty+=qty; else cart.push({key,id:item.id,name:item.name,unit,addons,notes,qty});
    updateCart();renderGrid();
  }
  function changeQty(index,d){const it=cart[index];if(!it)return;it.qty+=d;if(it.qty<=0)cart.splice(index,1);updateCart();renderGrid();renderCartItems();}
  function editCartItem(index){const line=cart[index],item=line&&products.find(p=>p.id===line.id);if(!item||(item.optionGroups||[]).length===0)return;openItemOptions(item,index);}

  function cartTotal(){return cart.reduce((s,c)=>s+c.unit*c.qty,0);}
  function cartCount(){return cart.reduce((s,c)=>s+c.qty,0);}
  function updateCart(){
    const n=cartCount();
    document.getElementById('cart-count').textContent=n;
    document.getElementById('cart-total').textContent='$'+cartTotal();
    document.getElementById('cartbtn').disabled=n===0;
  }
  function renderCartItems(){
    const el=document.getElementById('cart-items');
    document.getElementById('cart-title').textContent=`購物車${cart.length?'（'+cartCount()+' 件）':''}`;
    if(!cart.length){el.innerHTML='<div class="empty" style="padding:24px 0">購物車是空的</div>';}
    else el.innerHTML=cart.map((c,index)=>{
      const p=products.find(x=>x.id===c.id);
      const img=(p&&p.imagePath)?`<div class="ci-img"><img src="${esc(API_BASE+p.imagePath)}"></div>`:`<div class="ci-img">${foodEmoji(c.name)}</div>`;
      return `<div class="citem">${img}
        ${(p?.optionGroups||[]).length?`<button class="ci-info ci-edit" onclick="editCartItem(${index})" aria-label="重新編輯 ${esc(c.name)}"><div class="ci-name">${esc(c.name)}</div>
        ${c.addons.length?`<div class="ci-opt">${c.addons.map(a=>esc(a.name)).join('、')}</div>`:''}
        ${c.notes?`<div class="ci-note">備註：${esc(c.notes)}</div>`:''}<div class="ci-price">$${c.unit*c.qty}</div></button>`:`<div class="ci-info"><div class="ci-name">${esc(c.name)}</div><div class="ci-price">$${c.unit*c.qty}</div></div>`}
        <span class="stepper"><button onclick="changeQty(${index},-1)" aria-label="減少數量">−</button><span>${c.qty}</span><button onclick="changeQty(${index},1)" aria-label="增加數量">＋</button></span></div>`;
    }).join('');
    document.getElementById('checkout-total').textContent='$'+cartTotal();
  }

  function renderDining(){
    if(dining&&!diningOptions.includes(dining))dining=null;
    document.getElementById('dine-seg').innerHTML=diningOptions.map(d=>
      `<button class="${dining===d?'on':''}" onclick="setDining('${d}')">${DINING_LABELS[d]||d}</button>`).join('');
    document.getElementById('table-wrap').style.display=dining==='dineIn'?'block':'none';
  }
  function setDining(d){
    dining=d;
    if(d==='takeout')tableNo='外帶';
    if(d==='dineIn'){ if(tableNo==='外帶')tableNo=''; showTables=tableNo===''; }
    renderDining();renderTables();
  }
  function renderTables(){
    const el=document.getElementById('table-area');
    if(!showTables&&tableNo&&tableNo!=='外帶'){
      // 選完桌號就收起，只顯示已選 + 更改
      el.innerHTML=`<div class="row" style="padding:6px 0"><span style="font-weight:800;color:var(--accent)">${tableNo} 號桌</span>
        <button style="border:0;background:#e9e9ef;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer" onclick="editTables()">更改桌號</button></div>`;
      return;
    }
    el.innerHTML=`<div class="tables">${Array.from({length:Math.max(1,tableCount)},(_,i)=>i+1).map(n=>`<button class="${tableNo==String(n)?'on':''}" onclick="pickTable('${n}')">${n}</button>`).join('')}</div>`;
  }
  function pickTable(n){tableNo=String(n);showTables=false;renderTables();}
  function editTables(){showTables=true;renderTables();}
  function setPay(p){pay=p;renderPay();}
  function renderPay(){
    if(!payMethods.includes(pay))pay=payMethods[0]||'';
    document.getElementById('pay-seg').innerHTML=payMethods.map(m=>
      `<button class="${pay===m?'on':''}" onclick="setPay('${m}')">${PAY_LABELS[m]||m}</button>`).join('');
  }

  function renderTurnstile(){const wrap=document.getElementById('bot-check'),label=document.getElementById('bot-check-label'),status=document.getElementById('bot-check-status');wrap.style.display='block';label.style.display='block';if(!TURNSTILE_SITE_KEY){status.textContent='機器人驗證尚未啟用：請管理員設定 Cloudflare Turnstile 金鑰';return}if(!window.turnstile){status.textContent='正在載入機器人驗證…';if(turnstileRetries++<20)setTimeout(renderTurnstile,250);return}turnstileToken='';status.textContent='請完成驗證後再送出訂單';if(turnstileWidgetId!==null){window.turnstile.reset(turnstileWidgetId);return}turnstileWidgetId=window.turnstile.render('#turnstile-widget',{sitekey:TURNSTILE_SITE_KEY,theme:'light',size:'flexible',action:'place_order',callback:token=>{turnstileToken=token;status.textContent='驗證完成，可以送出訂單'},'expired-callback':()=>{turnstileToken='';status.textContent='驗證已逾時，請重新驗證'},'error-callback':()=>{turnstileToken='';status.textContent='驗證載入失敗，請重新整理頁面'}})}
  function resetTurnstile(){turnstileToken='';if(turnstileWidgetId!==null&&window.turnstile)window.turnstile.reset(turnstileWidgetId)}
  function openCart(){renderCartItems();renderDining();renderTables();renderPay();renderTurnstile();openSheet('cart-sheet');}
  function openSheet(id){document.getElementById('mask').classList.add('show');document.getElementById(id).classList.add('show');}
  function closeAll(){document.getElementById('mask').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));}

  async function checkout(){
    if(!cart.length||!store)return;
    if(!dining){alert('請先選擇「內用」或「外帶」');return;}
    if(dining==='dineIn'&&!tableNo){alert('內用請選擇桌號');return;}
    const customerName=document.getElementById('note').value.trim();
    if(!customerName){alert('請輸入訂購人名稱');document.getElementById('note').focus();return;}
    if(TURNSTILE_SITE_KEY&&!turnstileToken){alert('請先完成機器人驗證');return;}
    const btn=document.getElementById('submit-btn');btn.disabled=true;btn.textContent='送出中…';
    try{
      const order=await api(`/stores/${store.id}/orders`,{method:'POST',body:JSON.stringify({
        tableName:dining==='takeout'?'外帶':tableNo,
        note:'訂購人：'+customerName,
        staffName:'客人網頁點餐',paymentMethod:pay,diningOption:dining,
        turnstileToken:turnstileToken||undefined,
        items:cart.map(c=>({menuItemId:c.id,quantity:c.qty,selectedOptions:c.addons.map(a=>({groupName:a.groupName||'加料',choiceName:a.name,priceDelta:a.price})),notes:c.notes||null}))
      })});
      window.webkit?.messageHandlers?.zenposOrder?.postMessage(order);
      document.getElementById('success-total').textContent='$'+cartTotal();
      document.getElementById('order-id').textContent='訂單 #'+(order.orderNumber||order.id.slice(0,8).toUpperCase());
      closeAll();document.getElementById('success').classList.add('show');
    }catch(e){resetTurnstile();alert(e.message);}
    finally{btn.disabled=false;btn.textContent='送出訂單';}
  }
  function resetOrder(){cart=[];dining=null;tableNo='';showTables=true;document.getElementById('note').value='';
    resetTurnstile();
    document.getElementById('success').classList.remove('show');
    if(diningOptions.length===1)setDining(diningOptions[0]); else renderDining();
    updateCart();renderGrid();}

  async function refresh(){
    if(!store)return;
    const [s,cats,menu,pays,dines]=await Promise.all([api(`/stores/${store.id}`),api(`/stores/${store.id}/categories`),api(`/stores/${store.id}/menu-items`),api(`/stores/${store.id}/payment-methods`).catch(()=>payMethods),api(`/stores/${store.id}/dining-options`).catch(()=>diningOptions)]);
    const sig=JSON.stringify([s.name,s.tableCount,cats,menu,pays,dines]);
    if(sig===signature)return; signature=sig;
    if(Array.isArray(pays)&&pays.length){payMethods=pays;renderPay();}
    if(Array.isArray(dines)&&dines.length){diningOptions=dines; if(!dining&&dines.length===1)setDining(dines[0]); else renderDining();}
    store=s; tableCount=s.tableCount||s.effectiveTableCount||12;
    categories=[...cats].sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
    products=menu.filter(m=>m.enabled).map(m=>({id:m.id,name:m.name,category:m.categoryId,price:m.price,desc:m.description||'',imagePath:m.imagePath,optionGroups:m.optionGroups||[]}));
    if(selectedCat!=='all'&&!categories.some(c=>c.id===selectedCat))selectedCat='all';
    document.getElementById('store-name').textContent=s.name;
    document.title=s.name+'｜客人點餐';
    renderCats();renderGrid();updateCart();
  }

  async function init(){
    try{
      await resolveApiBase();
      if(!storeId)throw new Error('缺少店家識別碼，請使用店家專屬點餐網址。');
      store=await api(`/stores/${encodeURIComponent(storeId)}`);
      if(!store)throw new Error('目前沒有可用店家');
      await refresh();
      setInterval(()=>refresh().catch(()=>{}),2000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){signature='';refresh().catch(()=>{});}});
    }catch(e){document.querySelector('.wrap').innerHTML=`<div class="err">${esc(e.message)}<br><br>請確認網址的 ?api= 與 ?store= 是否正確。</div>`;}
  }
  init();
</script>
</body>
</html>
